name: Segurança

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  segredos:
    name: Detecção de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  html:
    name: Regras do site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sem script inline nem handlers on*=
        run: |
          if grep -nE '<script>|<script [^>]*>[^<]+</script>| on[a-z]+="' index.html; then
            echo "Script inline encontrado. Mova o JavaScript para js/ (a CSP bloqueia script inline)."
            exit 1
          fi
      - name: CSP e headers de segurança presentes
        run: |
          for h in Content-Security-Policy X-Frame-Options X-Content-Type-Options Referrer-Policy; do
            grep -q "\"$h\"" vercel.json || { echo "Header $h ausente no vercel.json"; exit 1; }
          done
      - name: Sintaxe dos scripts
        run: for f in api/*.js js/*.js; do node --check "$f"; done
      - name: Nenhum segredo com valor no .env.example
        run: |
          if grep -nE '^(WHATSAPP_TOKEN|TURNSTILE_SECRET_KEY)=.+' .env.example; then
            echo "Segredo preenchido no .env.example."
            exit 1
          fi
      - name: Links em nova aba com rel="noopener"
        run: |
          if grep -nE 'target="_blank"' index.html | grep -v 'rel="noopener'; then
            echo "Link com target=_blank sem rel=noopener."
            exit 1
          fi
      - name: Sem innerHTML, document.write ou eval nos scripts
        run: |
          if grep -rnE 'innerHTML|insertAdjacentHTML|document\.write|eval\(|new Function' js/ api/; then
            exit 1
          fi
